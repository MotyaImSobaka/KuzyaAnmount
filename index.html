<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пошукова Машина Кузя</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: white;
        }

        /* Головна частина по центру */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Логотип Кузі */
        .logo {
            font-size: clamp(60px, 10vw, 90px);
            font-weight: 500;
            letter-spacing: -2.5px;
            margin-bottom: 30px;
            user-select: none;
            cursor: default;
        }

        /* Фірмові кольори */
        .k { color: #4285F4; }
        .u { color: #EA4335; }
        .z { color: #FBBC05; }
        .y { color: #34A853; }
        .a { color: #4285F4; }

        /* Поле пошуку */
        .search-container {
            width: 100%;
            max-width: 584px;
            position: relative;
        }

        .search-bar {
            width: 100%;
            height: 46px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 0 45px 0 20px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            transition: box-shadow 0.2s;
        }

        .search-bar:focus {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(223,225,229,0);
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 13px;
            color: #9aa0a6;
            width: 20px;
            height: 20px;
        }

        /* Кнопки */
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        button {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            padding: 0 20px;
            height: 36px;
            cursor: pointer;
            transition: all 0.1s;
        }

        button:hover {
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
            border: 1px solid #dadce0;
            color: #202124;
        }

        /* Меморіальний текст */
        .memorial-text {
            margin-top: 50px;
            color: #70757a;
            font-style: italic;
            font-size: 14px;
            text-align: center;
            max-width: 400px;
            line-height: 1.5;
        }

        /* Підвал */
        footer {
            background: #f2f2f2;
            padding: 15px 30px;
            color: #70757a;
            font-size: 14px;
            border-top: 1px solid #dadce0;
            text-align: left;
        }
    </style>
</head>
<body>

<main>
    <div class="logo">
        <span class="k">К</span><span class="u">у</span><span class="z">з</span><span class="y">я</span>
    </div>

    <form class="search-container" id="search-form">
        <input type="text" class="search-bar" id="search-input" autofocus autocomplete="off" placeholder="Запитайте у Кузі...">
        <svg class="search-icon" focusable="false" viewBox="0 0 24 24">
            <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
        </svg>
    </form>

    <div class="buttons">
        <button type="button" onclick="performSearch()">Пошук Кузі</button>
        <button type="button" onclick="lucky()">Мені пощастить</button>
    </div>

    <div class="memorial-text">
         <br> 
        
    </div>
</main>

<footer>
    Україна • Пошукова Машина Кузя
</footer>

<script>
    const form = document.getElementById('search-form');
    const input = document.getElementById('search-input');

    function performSearch() {
        const query = input.value.trim();
        if (query) {
            window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
        }
    }

    function lucky() {
        window.location.href = `https://www.google.com/search?q=коти+це+любов&btnI=I`;
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        performSearch();
    });
</script>

</body>
</html>

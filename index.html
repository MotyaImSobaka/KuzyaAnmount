<!doctype html><html lang="uk"><head>  <meta charset="utf-8" />  <meta name="viewport" content="width=device-width,initial-scale=1" />  <title>ReconSim</title>  <link rel="stylesheet" href="styles.css"></head><body>  <header>    <h1>ReconSim</h1>    <p class="subtitle">Реалістична демонстрація — всі дані вигадані</p>  </header>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuzya Anmount</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #f1b7f8;
            color: #000000;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .title {
            font-size: 48px;
            margin-top: 20px;
            margin-bottom: 40px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .events {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .event {
            font-size: 24px;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">/Kuzya_Anmount</h1>
        
        <div class="events">
            <div class="event">boot mode</div>
            <div class="event">Please Terminate Session in next minute</div>
            <div class="event">New Operating System (linux Distro)/div>
                  <div class="event">   Next Update Bash Teminal
                    <div class="Оновлення">Апдейт: Сайт Тепер На Українській Мові</div>
</div>
        </div>
    </div>

    <!-- АУДІО - АБСОЛЮТНО ПРИХОВАНЕ -->
    <audio id="hiddenMusic" loop autoplay>
        <source src="githubForWeb.mp3" type="audio/mp3">
    </audio>

    <script>
        // Автоматичний запуск музики при завантаженні сторінки
        document.addEventListener('DOMContentLoaded', function() {
            const audio = document.getElementById('hiddenMusic');
            
            // Налаштування автопрогравання
            audio.volume = 0.3; // 30% гучності (тихо)
            audio.loop = true; // Повторювати безкінечно
            
            // Спробувати запустити музику
            const playAudio = () => {
                audio.play().catch(error => {
                    // Якщо браузер блокує автопрогравання
                    console.log("Браузер заблокував автокпрогравання");
                    
                    // Додамо невидиму кнопку для взаємодії
                    const silentBtn = document.createElement('button');
                    silentBtn.style.position = 'absolute';
                    silentBtn.style.opacity = '0';
                    silentBtn.style.width = '1px';
                    silentBtn.style.height = '1px';
                    silentBtn.innerHTML = 'Клікни мене для музики';
                    document.body.appendChild(silentBtn);
                    
                    // Клік по сторінці запустить музику
                    document.body.addEventListener('click', function startMusic() {
                        audio.play();
                        document.body.removeEventListener('click', startMusic);
                        silentBtn.remove();
                    }, { once: true });
                });
            };
            
            // Запуск через 1 секунду після завантаження
            setTimeout(playAudio, 1000);
            
            // Відновити програвання, якщо сторінка стає активною
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden && audio.paused) {
                    audio.play();
                }
            });
            
            // Продовжувати програвати при поверненні на вкладку
            window.addEventListener('focus', function() {
                if (audio.paused) {
                    audio.play();
                }
            });
        });
    </script>
</body>
</html>
